name: Overlay (Windows)

# The overlay window only runs on Windows. This compiles it with the real Windows PowerShell 5.1, shows it with a sample
# chat, clicks through it and uploads screenshots, so a change to the window can be looked at before it reaches a PC.
on:
  pull_request:
    paths:
      - 'apps/clipboard-agent/src/overlay/**'
      - 'apps/clipboard-agent/scripts/overlay-smoke.ts'
      - 'packages/client-core/**'
      - '.github/workflows/overlay-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Show the overlay with a sample chat
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the window and take screenshots
        run: pnpm exec tsx apps/clipboard-agent/scripts/overlay-smoke.ts overlay-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-screenshots
          path: overlay-shots/*.png
          if-no-files-found: warn
